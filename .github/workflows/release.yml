# Container release: build and test on every pull request; on main and on a
# version tag, publish a multi-arch (amd64 + arm64) image to GHCR and Docker
# Hub, signed with cosign, with a syft SBOM and build provenance attached.
#
# Docker Hub credentials come from Doppler (project star-daemon, config ci),
# never from this repository's secrets. The jobs live in
# ChiefGyk3D/git-your-ship-together.
#
# Image: ghcr.io/chiefgyk3d/star-daemon
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild of `latest` from main so base-image fixes reach the
    # published image between commits. Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@d57b0b6b08b84c68b5c33d5198e83eed8030c455 # v1.1.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: docker/Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
      dockerhub: true
      docker-test-command: docker run --rm "$IMAGE" sh -c "python -m py_compile /app/star-daemon.py /app/star_daemon.py /app/star_announcer.py /app/github_stars.py /app/config.py /app/platforms.py"
      doppler-project: star-daemon
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
