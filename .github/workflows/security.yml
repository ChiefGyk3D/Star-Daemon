# CodeQL, gitleaks, pip-audit, and dependency review on pull requests. The
# jobs live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets: inherit
    with:
      pip-audit-requirements: requirements.txt
      doppler-project: star-daemon
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
